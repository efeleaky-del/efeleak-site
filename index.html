<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EfeMedya ve LeakMedya | Web Tasarım</title>
<meta name="description" content="EfeMedya ve LeakMedya: markanız için hızlı, mobil uyumlu ve profesyonel web siteleri tasarlıyoruz.">
<style>
:root{--bg:#fff;--alt:#f5f7fb;--card:#fff;--tx:#0f172a;--mu:#5b6578;--bd:#e4e8f0;--ac:#2f5bff;--ac2:#1f3fd1;--star:#f5a623;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f19;--alt:#0f1422;--card:#141a2b;--tx:#eef2fa;--mu:#9aa5bb;--bd:#232b40;--ac:#5b82ff;--ac2:#4468ee;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f19;--alt:#0f1422;--card:#141a2b;--tx:#eef2fa;--mu:#9aa5bb;--bd:#232b40;--ac:#5b82ff;--ac2:#4468ee;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.w{max-width:1080px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--bd)}
header .w{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--ac);display:inline-block}
nav{display:flex;gap:28px;font-size:15px;color:var(--mu)}
nav a:hover{color:var(--tx)}
@media(max-width:760px){nav{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:10px;font-weight:600;font-size:15px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-family:inherit}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.p:hover{background:var(--ac2)}
.btn.sm{padding:9px 16px;font-size:14px}
.hero{padding:84px 0 72px;background:var(--alt);border-bottom:1px solid var(--bd)}
.hero .w{max-width:820px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--bd);background:var(--card);border-radius:999px;font-size:13px;color:var(--mu);margin-bottom:22px}
.st{color:var(--star);letter-spacing:1px}
h1{font-size:clamp(34px,6.5vw,58px);line-height:1.1;letter-spacing:-.03em;margin:0 0 18px}
.lead{color:var(--mu);font-size:18px;max-width:600px;margin:0 auto}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.trust{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin-top:44px;padding-top:28px;border-top:1px solid var(--bd)}
.trust div{text-align:center}.trust b{display:block;font-size:24px;letter-spacing:-.02em}.trust span{font-size:13px;color:var(--mu)}
section{padding:88px 0}section.alt{background:var(--alt);border-block:1px solid var(--bd)}
.hd{max-width:600px;margin:0 0 44px}
.hd.c{margin-inline:auto;text-align:center}
.eb{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
